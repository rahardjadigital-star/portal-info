<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Portal — DEMO</title>
<style>
body{margin:0;background:#111318;color:#f3f5f7;font-family:Arial,sans-serif;padding:24px}.box{max-width:720px;margin:auto;background:#1b1f27;border:1px solid #333b4a;border-radius:16px;padding:22px}label{display:block;color:#aab2c0;font-size:13px;margin-top:14px}input{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #3b4352;background:#10131a;color:#fff}button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;background:#5b7cff;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#2a303c;margin-left:8px}.msg{margin-top:15px;padding:12px;background:#151a22;border-radius:10px}.hidden{display:none}.note{margin-top:18px;background:#2b2222;border:1px solid #674545;color:#ffd6d6;padding:12px;border-radius:10px;font-size:13px}
</style></head><body><div class="box"><h1>Admin Portal Informasi</h1>
<div id="loginView"><label>Email admin</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="loginBtn">Login</button></div>
<div id="editorView" class="hidden"><p>Login sebagai: <b id="who"></b></p>
<label>Nama</label><input id="name"><label>Nomor Identitas</label><input id="idNumber"><label>Instansi / Sekolah</label><input id="school"><label>Tempat, Tanggal Lahir</label><input id="birth"><label>Nomor Dokumen</label><input id="docNumber"><label>Tahun</label><input id="year">
<button id="saveBtn">Simpan Perubahan</button><button id="logoutBtn" class="secondary">Logout</button></div>
<div class="msg" id="msg">Silakan login.</div><div class="note">Template demo — bukan situs pemerintah atau layanan verifikasi resmi.</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig = {"apiKey": "AIzaSyAksNFn7lb1o_HPs5KW-wilL6SEbGDeHnA", "authDomain": "portal-info-97816.firebaseapp.com", "projectId": "portal-info-97816", "storageBucket": "portal-info-97816.firebasestorage.app", "messagingSenderId": "665589087425", "appId": "1:665589087425:web:e739e58898c41d45cf6840"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app); const ref=doc(db,"portalData","main");
const fields=["name","idNumber","school","birth","docNumber","year"], msg=document.getElementById("msg");
async function loadData(){const snap=await getDoc(ref);if(snap.exists()){const d=snap.data();fields.forEach(id=>document.getElementById(id).value=d[id]??"");}}
document.getElementById("loginBtn").onclick=async()=>{msg.textContent="Login...";try{await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value);}catch(e){console.error(e);msg.textContent="Login gagal. Cek email/password.";}};
document.getElementById("saveBtn").onclick=async()=>{msg.textContent="Menyimpan...";const data={};fields.forEach(id=>data[id]=document.getElementById(id).value.trim());try{await setDoc(ref,data,{merge:true});msg.textContent="Berhasil disimpan.";}catch(e){console.error(e);msg.textContent="Gagal menyimpan. Cek Firestore Rules.";}};
document.getElementById("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async(user)=>{if(user){document.getElementById("loginView").classList.add("hidden");document.getElementById("editorView").classList.remove("hidden");document.getElementById("who").textContent=user.email||user.uid;msg.textContent="Login berhasil.";try{await loadData();}catch(e){console.error(e);}}else{document.getElementById("editorView").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden");msg.textContent="Silakan login.";}})
</script></body></html>
