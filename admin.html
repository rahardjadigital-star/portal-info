<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor Portal — DEMO</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#111318;color:#f3f5f7;margin:0;padding:24px}.box{max-width:720px;margin:auto;background:#1b1f27;border:1px solid #333b4a;border-radius:16px;padding:22px}label{display:block;color:#aab2c0;font-size:13px;margin-top:14px}input,textarea{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #3b4352;background:#10131a;color:white}button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;background:#5b7cff;color:white;font-weight:700;cursor:pointer}.note{margin-top:18px;color:#ffd6d6;background:#2b2222;border:1px solid #674545;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="box">
<h1>Editor Data Portal</h1>
<p>Edit data di bawah, lalu klik tombol untuk membuat file <b>index.html</b> baru.</p>
<label>Nama</label><input id="name" value="Nama Contoh">
<label>Nomor Identitas</label><input id="idNumber" value="000000000">
<label>Instansi / Sekolah</label><input id="school" value="(P000000) NAMA INSTANSI">
<label>Tempat, Tanggal Lahir</label><input id="birth" value="Bandung, 1 Januari 2000">
<label>Nomor Dokumen</label><input id="docNumber" value="1234567890">
<label>Tahun</label><input id="year" value="2025/2026">
<button onclick="generate()">Buat index.html</button>
<div class="note">Editor ini hanya untuk mempermudah pengisian template demo. Halaman publik tetap diberi label DEMO dan bukan layanan verifikasi resmi.</div>
</div>
<script>
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function generate(){
 const d={
  name:esc(document.getElementById('name').value),
  idNumber:esc(document.getElementById('idNumber').value),
  school:esc(document.getElementById('school').value),
  birth:esc(document.getElementById('birth').value),
  docNumber:esc(document.getElementById('docNumber').value),
  year:esc(document.getElementById('year').value)
 };
 let html = `<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Informasi Dokumen — DEMO</title>
 <style>body{font-family:Arial;background:#111318;color:#f3f5f7;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.badge{display:inline-block;background:#b14b4b;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:bold}.card{margin-top:18px;background:#1b1f27;border:1px solid #333b4a;border-radius:14px;overflow:hidden}.row{padding:16px;border-bottom:1px solid #333b4a}.row:last-child{border:0}.label{color:#aab2c0;font-size:13px}.value{font-size:18px;font-weight:bold;margin-top:4px}.notice{margin-top:18px;padding:14px;border-radius:12px;background:#2b2222;border:1px solid #674545;color:#ffd6d6}</style></head><body><div class="wrap">
 <span class="badge">DEMO</span><h1>Hasil Pemeriksaan Informasi Dokumen</h1><h2>${d.name}</h2><div>${d.idNumber}</div>
 <div class="card"><div class="row"><div class="label">Instansi / Sekolah</div><div class="value">${d.school}</div></div>
 <div class="row"><div class="label">Tempat, Tanggal Lahir</div><div class="value">${d.birth}</div></div>
 <div class="row"><div class="label">Nomor Dokumen</div><div class="value">${d.docNumber}</div></div>
 <div class="row"><div class="label">Tahun</div><div class="value">${d.year}</div></div></div>
 <div class="notice">Template demo — bukan situs pemerintah atau layanan verifikasi resmi.</div></div></body></html>`;
 const blob=new Blob([html],{type:'text/html'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();URL.revokeObjectURL(a.href);
}
</script>
</body></html>
